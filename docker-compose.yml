# AirBreda - LOCAL development stack: db, redis, both ingesters and the dashboard.
# The EC2 VM does NOT use this file: it runs infra/vm/deploy.sh (no Redis, ADR-0004).
# See docs/runbook.md section 3.
#
#   docker compose up -d --build     # start everything; ingesters poll hourly, dashboard on :8000
#   docker compose ps                # all services should become "healthy"
#   docker compose logs -f air-ingest traffic-ingest   # structured JSON logs
#   curl http://localhost:8001/health   # air-ingest    (PowerShell: curl.exe)
#   curl http://localhost:8002/health   # traffic-ingest
#
# Secrets and settings come from .env next to this file (see .env.example).

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: airbreda
      POSTGRES_USER: airbreda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # first start only
    ports:
      - "127.0.0.1:5432:5432"   # this machine only, never the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbreda -d airbreda"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [airbreda]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    # Append-only file: queued messages survive a Redis restart (see ADR-0002).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [airbreda]   # no ports: only reachable by the other containers
    restart: unless-stopped

  air-ingest:
    build:
      context: .
      dockerfile: services/air/Dockerfile
    container_name: air-ingest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://airbreda:${POSTGRES_PASSWORD}@db:5432/airbreda
      REDIS_HOST: redis
      POLL_INTERVAL_SECONDS: ${AIR_POLL_INTERVAL_SECONDS:-3600}
    ports:
      - "127.0.0.1:8001:8000"   # GET /health
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [airbreda]
    restart: unless-stopped

  traffic-ingest:
    build:
      context: .
      dockerfile: services/traffic/Dockerfile
    container_name: traffic-ingest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://airbreda:${POSTGRES_PASSWORD}@db:5432/airbreda
      REDIS_HOST: redis
      AWS_REGION: eu-north-1   # the only region the account allows (ADR-0004)
      POLL_INTERVAL_SECONDS: ${TRAFFIC_POLL_INTERVAL_SECONDS:-3600}
    volumes:
      # Laptop only: lend the container your AWS CLI credentials, read-only.
      # On EC2 (Day 3) an IAM role replaces this - no keys on the VM.
      - ${AWS_CONFIG_DIR:-~/.aws}:/root/.aws:ro
    ports:
      - "127.0.0.1:8002:8000"   # GET /health
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [airbreda]
    restart: unless-stopped

  # Day 4: test the dashboard next to the ingesters BEFORE it goes to the VM.
  #   docker compose up -d --build   then open http://localhost:8000
  # It reads NO2 from the local db and traffic from the REAL bucket (S3_BUCKET
  # in .env), with your laptop's AWS credentials, read-only mounted.
  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: dashboard
    env_file: .env
    environment:
      DATABASE_URL: postgresql://airbreda:${POSTGRES_PASSWORD}@db:5432/airbreda
      AWS_REGION: eu-north-1
      AIR_HEALTH_URL: http://air-ingest:8000/health
      TRAFFIC_HEALTH_URL: http://traffic-ingest:8000/health
    volumes:
      - ${AWS_CONFIG_DIR:-~/.aws}:/root/.aws:ro
    ports:
      - "127.0.0.1:8000:8000"   # GET /, /site/{id}, /health
    depends_on:
      db:
        condition: service_healthy
    networks: [airbreda]
    restart: unless-stopped

networks:
  airbreda:
    name: airbreda   # fixed name, so `docker network ls` shows exactly "airbreda"

volumes:
  pgdata:
  redisdata:
